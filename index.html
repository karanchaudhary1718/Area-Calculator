<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Area Calculator</title>

  <!-- INLINE CSS -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .logo {
      width: 120px;
      margin: 20px auto 10px;
      display: block;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 5px;
    }

    h2 {
      color: #555;
      font-weight: normal;
    }

    .card {
      background: #fff;
      width: 320px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    select, input {
      width: 90%;
      padding: 8px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 10px;
      width: 95%;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #0056b3;
    }

    #result {
      font-size: 18px;
      margin-top: 15px;
      color: #27ae60;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <img src="logo.jpg" alt="Logo" class="logo">

  <h1>Calculate Area</h1>
  <h2>Select a Shape</h2>

  <div class="card">
    <select id="shape">
      <option value="">-- Select Shape --</option>
      <option value="triangle">Triangle</option>
      <option value="square">Square</option>
      <option value="rectangle">Rectangle</option>
      <option value="circle">Circle</option>
    </select>

    <div id="inputs"></div>

    <button onclick="calculate()">Calculate Area</button>
  </div>

  <p id="result"></p>

  <!-- INLINE JS -->
  <script>
    const inputs = document.getElementById("inputs");
    const result = document.getElementById("result");

    document.getElementById("shape").addEventListener("change", function () {
      let html = "";
      if (this.value === "triangle") {
        html = `
          <input type="number" id="a" placeholder="Base">
          <input type="number" id="b" placeholder="Height">
        `;
      } 
      else if (this.value === "square") {
        html = `<input type="number" id="s" placeholder="Side">`;
      } 
      else if (this.value === "rectangle") {
        html = `
          <input type="number" id="w" placeholder="Width">
          <input type="number" id="h" placeholder="Height">
        `;
      } 
      else if (this.value === "circle") {
        html = `<input type="number" id="r" placeholder="Radius">`;
      }
      inputs.innerHTML = html;
      result.innerText = "";
    });

    function calculate() {
      const shape = document.getElementById("shape").value;
      let area = 0;

      if (shape === "triangle") {
        area = 0.5 * a.value * b.value;
      } 
      else if (shape === "square") {
        area = s.value * s.value;
      } 
      else if (shape === "rectangle") {
        area = w.value * h.value;
      } 
      else if (shape === "circle") {
        area = Math.PI * r.value * r.value;
      }

      if (!area || area <= 0) {
        result.innerText = "Please enter valid values";
        result.style.color = "red";
      } else {
        result.innerText = "Area = " + area.toFixed(2);
        result.style.color = "#27ae60";
      }
    }
  </script>

</body>
</html>
