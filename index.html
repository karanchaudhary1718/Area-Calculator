<h1>Calculate Area</h1>
<h2>Select a Shape:</h2>
<div class="card">
  <select id="shape">
    <option value="">--Select--</option>
    <option value="triangle">Triangle</option>
    <option value="square">Square</option>
    <option value="rectangle">Rectangle</option>
    <option value="circle">Circle</option>
  </select>

  <div id="inputs"></div>

  <button onclick="calculate()">Calculate Area</button>
</div>
<p id="result"></p>
<script>
  const inputs = document.getElementById("inputs");
  document.getElementById("shape").onchange = function () {
    let html = "";
    if (this.value === "triangle") {
      html = Base: <input id="a"> Height: <input id="b">;
    } else if (this.value === "square") {
      html = Side: <input id="s">;
    } else if (this.value === "rectangle") {
      html = Width: <input id="w"> Height: <input id="h">;
    } else if (this.value === "circle") {
      html = Radius: <input id="r">;
    }
    inputs.innerHTML = html;
  };

  function calculate() {
    const shape = document.getElementById("shape").value;
    let area = 0;
    if (shape === "triangle") {
      let a = parseFloat(document.getElementById("a").value);
      let b = parseFloat(document.getElementById("b").value);
      area = 0.5 * a * b;
    } else if (shape === "square") {
      let s = parseFloat(document.getElementById("s").value);
      area = s * s;
    } else if (shape === "rectangle") {
      let w = parseFloat(document.getElementById("w").value);
      let h = parseFloat(document.getElementById("h").value);
      area = w * h;
    } else if (shape === "circle") {
      let r = parseFloat(document.getElementById("r").value);
      area = Math.PI * r * r;
    }
    document.getElementById("result").innerText = "Area: " + area;
  }
</script>
